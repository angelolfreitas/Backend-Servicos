spring.application.name=usuario-service
server.port=8081

spring.docker.compose.enabled=false

spring.kafka.bootstrap-servers=localhost:9092

spring.datasource.url=jdbc:mysql://localhost:3307/usuario_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=update


spring.security.user.name=angelo
spring.security.user.password=123
api.security.token.secret=123

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.upload-dir=uploads/documentos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.elos.usuario_service.dto.ContaModerada
spring.kafka.consumer.properties.spring.json.trusted.packages=com.elos.usuario_service.dto

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ltdaelos@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.sender=ltdaelos@gmail.com
app.frontend-url=${FRONT_URL}