spring.application.name=catalogo-service
server.port=8082

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest

spring.datasource.url=jdbc:mysql://localhost:3307/catalogo_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=update

api.security.token.secret=123

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.elos.catalogo_service.dto.catalogo.PrestadorAprovado
spring.kafka.consumer.properties.spring.json.trusted.packages=com.elos.catalogo_service.dto.catalogo
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.upload-dir=uploads/portfolio
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB