spring.application.name=comunicacao-service
server.port=8084

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.elos.comunicacao_service.dto.ContratacaoAtualizada
spring.kafka.consumer.properties.spring.json.trusted.packages=com.elos.comunicacao_service.dto

spring.datasource.url=jdbc:mysql://localhost:3307/comunicacao_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=update

api.security.token.secret=123

app.upload-dir=uploads/chat
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB