spring.application.name=negociacao-service
server.port=8083

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.elos.negociacao_service.dto.ServicoAtualizado
spring.kafka.consumer.properties.spring.json.trusted.packages=com.elos.negociacao_service.dto
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.datasource.url=jdbc:mysql://localhost:3307/negociacao_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=update

api.security.token.secret=123